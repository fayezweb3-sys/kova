[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kova"
version = "0.1.0"
description = "Drug supply and coverage for Ontario and BC pharmacies, from official public data."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kova = "kova.__main__:main"

[tool.setuptools]
packages = ["kova", "kova.sources", "kova.services"]

[tool.setuptools.package-data]
kova = ["web/index.html"]
