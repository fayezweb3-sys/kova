<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --navy: #13233a; --navy-2: #22344f; --text: #13233a; --muted: #56657a; --faint: #8a96a8;
  --bg: #f7f5ef; --card: #fff; --line: #e3e8ef; --line-2: #d3dae4; --mist: #f4f6f9;
  --sun: #ffd23f; --sun-tint: #fff6d6; --sky: #3b8ef0; --sky-tint: #eaf3fe;
  --ok: #1e8e4e; --ok-tint: #e7f5ec; --warn: #a35f00; --warn-tint: #fff3df; --bad: #b42318; --bad-tint: #fdecea;
  --display: "Urbanist", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; color: var(--navy); }
h1 { font-size: 1.9rem; line-height: 1.15; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
header.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
header.top .wrap { height: 64px; display: flex; align-items: center; gap: 28px; }
.logo svg { height: 26px; width: auto; display: block; }
nav { display: flex; gap: 6px; }
nav a { text-decoration: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 0.92rem; transition: background-color .2s, color .2s; }
nav a:hover { background: var(--mist); color: var(--navy); }
nav a.on { background: var(--navy); color: #fff; }
.banner { background: var(--sun-tint); border-bottom: 1px solid #f1df9a; font-size: 0.85rem; color: #5b4a10; }
.banner .wrap { padding-top: 8px; padding-bottom: 8px; }
main { padding: 28px 0 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 20px 22px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } header.top .wrap { gap: 12px; } nav a { padding: 7px 8px; } }
@media (max-width: 520px) { .logo svg { height: 22px; } nav { gap: 2px; overflow-x: auto; min-width: 0; } nav a { font-size: 0.85rem; padding: 6px 7px; white-space: nowrap; } .ev { grid-template-columns: 80px minmax(0, 1fr); } }
.searchbox { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 0 14px; box-shadow: 0 8px 24px -16px rgba(19,35,58,.25); transition: border-color .15s, box-shadow .15s; }
.searchbox:focus-within { border-color: var(--sky); box-shadow: 0 0 0 4px rgba(59,142,240,.15); }
.searchbox input { flex: 1; border: 0; outline: 0; font: 500 1.05rem var(--body); padding: 15px 0; background: none; color: var(--navy); min-width: 0; }
.searchbox svg { color: var(--faint); flex: none; }
.hint { color: var(--faint); font-size: 0.85rem; margin-top: 10px; }
.hint button { border: 0; background: none; color: var(--sky); font: inherit; cursor: pointer; padding: 0; }
.results { margin-top: 18px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background-color .15s; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fbfcfd; }
.row b { font-weight: 600; }
.row small { display: block; color: var(--faint); font-size: 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ok { background: var(--ok-tint); color: var(--ok); }
.warn { background: var(--warn-tint); color: var(--warn); }
.bad { background: var(--bad-tint); color: var(--bad); }
.sky { background: var(--sky-tint); color: #1d5fae; }
.neutral { background: var(--mist); color: var(--muted); }
.din { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); font-size: 0.82rem; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 18px; }
.summary > div { padding: 14px 18px; border-right: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.summary > div:last-child { border-right: 0; }
.summary .k { font-size: 0.72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.summary .v { font-weight: 600; }
@media (max-width: 820px) { .summary { grid-template-columns: 1fr 1fr; } .summary > div:nth-child(2) { border-right: 0; } .summary > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
.seg { display: inline-flex; background: var(--mist); border: 1px solid var(--line); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font: 600 0.85rem var(--body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(19,35,58,.12); }
.alt { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.alt:last-child { border-bottom: 0; }
.alt .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.alt.best { background: #f6fbf8; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }
.sub { padding: 8px 18px; font-size: 0.72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); background: #fbfcfd; border-bottom: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); background: #fbfcfd; font-weight: 700; }
tr:last-child td { border-bottom: 0; }
.tw { overflow-x: auto; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 0.9rem; }
dt { color: var(--faint); }
dd { margin: 0; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--navy); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 9px; font: 600 0.9rem var(--body); cursor: pointer; transition: background-color .2s, transform .15s; }
.btn:hover { background: var(--navy-2); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: #fff; color: var(--navy); border-color: var(--line-2); }
label.f { display: grid; gap: 5px; font-size: 0.85rem; font-weight: 600; }
.f input, .f textarea { border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; font: 0.92rem var(--body); color: var(--navy); background: #fff; }
.f textarea { min-height: 110px; font-family: var(--mono); font-size: 0.85rem; }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px rgba(59,142,240,.15); }
.stack { display: grid; gap: 12px; }
.ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.ev:last-child { border-bottom: 0; }
.back { text-decoration: none; color: var(--muted); font-size: 0.88rem; font-weight: 600; }
.back:hover { color: var(--navy); }
.fade { animation: fade .25s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
footer { color: var(--faint); font-size: 0.8rem; padding: 0 0 40px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/" aria-label="Kova home"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="-2340.0 190.0 6713.0 2100.0">
  
  <mask id="l-colour" maskUnits="userSpaceOnUse" x="-2592.0" y="-62.0" width="2604.0" height="2604.0"><rect x="-2592.0" y="-62.0" width="2604.0" height="2604.0" fill="white"/><circle cx="-1290.0" cy="1240.0" r="576.6" fill="black"/><g transform="translate(-1290.0 1240.0) rotate(-52)"><rect x="465.0" y="-60.5" width="837.0" height="120.9" fill="black"/></g></mask><circle cx="-1290.0" cy="1240.0" r="930.0" fill="#13233A" mask="url(#l-colour)"/><circle cx="-1290.0" cy="1240.0" r="279.0" fill="#FFD23F"/><path d="M1048.0 1900H730.0L518.0 1535L396.0 1680V1900H120.0V400H396.0V1251L690.0 900H1050.0L707.0 1311Z M2795.0 1900H2438.0L2074.0 900H2368.0L2616.0 1583L2864.0 900H3159.0Z M3977.0 900H4253.0V1900H3976.0L3963.0 1796Q3924.0 1854 3863.0 1890.0Q3802.0 1926 3720.0 1926Q3608.0 1926 3511.0 1884.0Q3414.0 1842 3340.0 1768.0Q3266.0 1694 3224.5 1596.5Q3183.0 1499 3183.0 1387Q3183.0 1280 3222.0 1187.0Q3261.0 1094 3332.0 1023.0Q3403.0 952 3495.5 912.0Q3588.0 872 3695.0 872Q3787.0 872 3860.5 911.0Q3934.0 950 3989.0 1010ZM3713.0 1661Q3781.0 1661 3836.0 1626.0Q3891.0 1591 3923.0 1531.5Q3955.0 1472 3955.0 1400Q3955.0 1327 3923.0 1268.0Q3891.0 1209 3836.0 1174.0Q3781.0 1139 3713.0 1139Q3644.0 1139 3588.0 1174.0Q3532.0 1209 3499.0 1268.5Q3466.0 1328 3466.0 1400Q3466.0 1472 3499.5 1531.5Q3533.0 1591 3589.0 1626.0Q3645.0 1661 3713.0 1661Z" fill="#13233A" stroke="#13233A" stroke-width="44.0" stroke-linejoin="round"/><path d="M1550.0 1926Q1412.0 1926 1298.5 1855.0Q1185.0 1784 1117.5 1664.5Q1050.0 1545 1050.0 1400Q1050.0 1290 1089.0 1194.5Q1128.0 1099 1196.5 1026.5Q1265.0 954 1356.0 913.0Q1447.0 872 1550.0 872Q1688.0 872 1801.5 943.0Q1915.0 1014 1982.5 1134.0Q2050.0 1254 2050.0 1400Q2050.0 1509 2011.0 1604.0Q1972.0 1699 1903.5 1771.5Q1835.0 1844 1744.5 1885.0Q1654.0 1926 1550.0 1926ZM1550.0 1650Q1614.0 1650 1665.0 1615.5Q1716.0 1581 1745.0 1524.0Q1774.0 1467 1774.0 1400Q1774.0 1331 1743.5 1273.5Q1713.0 1216 1662.0 1182.0Q1611.0 1148 1550.0 1148Q1487.0 1148 1436.0 1183.0Q1385.0 1218 1355.5 1275.0Q1326.0 1332 1326.0 1400Q1326.0 1471 1356.5 1527.5Q1387.0 1584 1438.0 1617.0Q1489.0 1650 1550.0 1650Z" fill="#13233A" stroke="#13233A" stroke-width="44.0" stroke-linejoin="round"/>
</svg></a>
  <nav><a href="#/" data-nav="search">Search</a><a href="#/watch" data-nav="watch">Watchlists</a><a href="#/changes" data-nav="changes">Changes</a><a href="#/data" data-nav="data">Data</a></nav>
</div></header>
<div class="banner" id="banner" hidden><div class="wrap"></div></div>
<main><div class="wrap" id="view"></div></main>
<!--STATIC-->
<footer><div class="wrap">Kova uses official public data and shows each source's date. It supports professional judgement and doesn't replace it; the official formularies govern coverage.</div></footer>
<script>
const $ = (s, el = document) => el.querySelector(s);
const KEY = (() => { try { return localStorage.getItem("kova-key") || ""; } catch { return ""; } })();
async function api(path, opts = {}) {
  if (window.KOVA_STATIC) return staticApi(path, opts);
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(KEY ? { "X-API-Key": KEY } : {}), ...(opts.headers || {}) } });
  if (r.status === 204) return null;
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const money = (x) => x == null ? "–" : "$" + Number(x).toFixed(4);
const day = (s) => s ? String(s).slice(0, 10) : "–";
const pill = (cls, text) => h("span", { class: `pill ${cls}` }, text);
const statusText = (s) => (s || "").replace(/_/g, " ");
function chipsFor(x) {
  return [
    x.marketed === false ? pill("neutral", "Not marketed") : null,
    x.open_shortage ? pill("bad", x.tier_3 ? "Shortage · Tier 3" : "Shortage") : null,
    x.ontario ? pill(x.ontario === "benefit" ? "ok" : x.ontario === "temporary benefit" ? "sky" : "neutral", "ON " + x.ontario) : null,
    x.bc ? pill(x.bc === "covered" ? "ok" : "neutral", "BC " + x.bc) : null,
    x.recalls ? pill("warn", `${x.recalls} recall${x.recalls > 1 ? "s" : ""}`) : null,
  ];
}

// ---------- static mode: the same pages, served from prebuilt JSON (no server) ----------
const cache = {};
const getJSON = (url) => cache[url] || (cache[url] = fetch(url).then((r) => { if (!r.ok) throw new Error("Not found"); return r.json(); }));
const ON_NAME = { 1: "benefit", 2: "temporary benefit", 3: "not a benefit" };
const store = {
  load() { try { return JSON.parse(localStorage.getItem("kova-watchlists") || "[]"); } catch { return []; } },
  save(v) { try { localStorage.setItem("kova-watchlists", JSON.stringify(v)); } catch {} },
};
async function shardEntry(din) {
  const d = String(din).replace(/\D/g, "").padStart(8, "0");
  const shard = await getJSON(`data/p/${d.slice(0, 5)}.json`).catch(() => ({}));
  return [d, shard[d]];
}
function fillProduct(p, meta) {
  p.shortages = p.shortages || []; p.recalls = p.recalls || []; p.ingredients = p.ingredients || [];
  p.ontario = p.ontario || null; p.bc = p.bc || null; p.health_canada = p.health_canada || null;
  if (p.bc) p.bc.plans = p.bc.plans || [];
  p.summary = Object.assign({ marketed: null, open_shortage: false, tier_3: false, recalls: 0, ontario: null, bc: null }, p.summary || {});
  p.sources = {};
  for (const [k, v] of Object.entries(meta.sources || {})) p.sources[k] = { name: v.name, checked: v.run_at, version: v.version };
  return p;
}
function fillAlt(a, din, prov) {
  a = a || { province: prov, din, listed: false };
  for (const k of ["alternatives", "related", "not_covered"]) a[k] = (a[k] || []).map((i) => Object.assign({ shortage: [], open_shortage: false, available: true }, i));
  return a;
}
async function statusRow(din) {
  const [d, e] = await shardEntry(din);
  if (!e) return { din: d, found: false };
  const p = e.product;
  return Object.assign({ din: d, name: p.name, strength: p.strength, dosage_form: p.dosage_form, company: p.company, found: true }, fillProduct(p, {}).summary);
}
async function staticApi(path, opts) {
  const url = new URL(path, location.href), seg = url.pathname.split("/").filter(Boolean);
  const meta = await getJSON("data/meta.json");
  const method = (opts.method || "GET").toUpperCase();
  if (seg[0] === "health") return { ok: true, products: meta.products, sources: meta.sources };
  if (seg[1] === "sources") return Object.entries(meta.sources).map(([id, v]) => ({ id, ...v }));
  if (seg[1] === "search") {
    const idx = await getJSON("data/search.json");
    const words = (url.searchParams.get("q") || "").toUpperCase().split(/\s+/).filter(Boolean);
    const digits = words.join("");
    let rows;
    if (/^\d{5,8}$/.test(digits)) rows = idx.filter((r) => r[0].includes(digits.length === 8 ? digits : digits));
    else {
      const strength = words.find((w) => /^\d+(\.\d+)?(MG|MCG|G|ML)?$/.test(w));
      const terms = words.filter((w) => w !== strength && !/^(MG|MCG|G|ML)$/.test(w));
      const num = strength ? strength.match(/^\d+(\.\d+)?/)[0] : null;
      const re = num ? new RegExp(`(^|[^\\d.])${num.replace(".", "\\.")}([^\\d.]|$)`) : null;
      rows = idx.filter((r) => { const hay = `${r[1]} ${r[5]}`.toUpperCase(); return terms.every((t) => hay.includes(t)) && (!re || re.test(`${r[2]} ${r[1]}`)); });
      rows.sort((a, b) => (b[6] === 1) - (a[6] === 1) || (b[8] > 0) - (a[8] > 0) || a[1].localeCompare(b[1]));
    }
    const limit = +url.searchParams.get("limit") || 25;
    return rows.slice(0, limit).map((r) => ({ din: r[0], name: r[1], strength: r[2], dosage_form: r[3], company: r[4],
      marketed: r[6] == null ? null : !!r[6], open_shortage: r[7] > 0, tier_3: r[7] > 1, ontario: ON_NAME[r[8]] || null, ontario_price: r[9], bc: r[10] ? "covered" : null }));
  }
  if (seg[1] === "products") {
    const [, e] = await shardEntry(seg[2]);
    if (!e) throw new Error("No product with that DIN or PIN in any source");
    return fillProduct(e.product, meta);
  }
  if (seg[1] === "alternatives") {
    const prov = seg[2].toUpperCase(), [d, e] = await shardEntry(seg[3]);
    return fillAlt(e && e.alt && e.alt[prov], d, prov);
  }
  if (seg[1] === "events") return getJSON("data/changes.json");
  if (seg[1] === "watchlists") {
    let lists = store.load();
    const id = seg[2] ? +seg[2] : null;
    if (!id && method === "POST") {
      const body = JSON.parse(opts.body || "{}");
      const dins = [...new Set(((body.text || "").match(/(?<!\d)\d{6,8}(?!\d)/g) || []).map((x) => x.padStart(8, "0")))];
      if (!dins.length) throw new Error("No DINs found");
      const w = { id: Date.now(), name: body.name || "Watchlist", dins, created: new Date().toISOString(), kinds: [] };
      lists.push(w); store.save(lists); return w;
    }
    if (!id) return lists;
    const w = lists.find((x) => x.id === id);
    if (!w) throw new Error("No such watchlist");
    if (method === "DELETE") { store.save(lists.filter((x) => x.id !== id)); return null; }
    if (seg[3] === "events") return (await getJSON("data/changes.json")).filter((e) => w.dins.includes(e.din)).sort((a, b) => a.id - b.id);
    return { ...w, products: await Promise.all(w.dins.map(statusRow)) };
  }
  throw new Error("Not available on this site");
}

const view = $("#view");
function setNav(name) { document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === name)); }
function errorBox(e) { return h("div", { class: "card empty" }, String(e.message || e)); }

// ---------- search ----------
let lastQuery = "";
async function pageSearch() {
  setNav("search");
  const input = h("input", { placeholder: "Search a drug, brand, ingredient or DIN", value: lastQuery, "aria-label": "Search", autofocus: true });
  const results = h("div", { class: "results" });
  const run = debounce(async () => {
    const q = input.value.trim(); lastQuery = q;
    if (q.length < 2) { results.replaceChildren(); return; }
    try {
      const hits = await api(`/v1/search?q=${encodeURIComponent(q)}&limit=40`);
      results.replaceChildren(hits.length ? h("div", { class: "card fade" }, hits.map((x) =>
        h("a", { class: "row", href: `#/p/${x.din}` },
          h("div", {}, h("b", {}, `${x.name || "Unnamed"} ${x.strength || ""}`), h("small", {}, `${x.dosage_form || ""} · ${x.din.startsWith("09") ? "PIN" : "DIN"} ${x.din}${x.company ? " · " + x.company : ""}`)),
          h("div", { class: "chips" }, chipsFor(x), x.ontario_price != null ? h("span", { class: "price small" }, money(x.ontario_price)) : null))))
        : h("div", { class: "card empty fade" }, "Nothing found. Try the ingredient name or the 8-digit DIN."));
    } catch (e) { results.replaceChildren(errorBox(e)); }
  }, 180);
  input.addEventListener("input", run);
  const example = (q) => h("button", { onclick: () => { input.value = q; run(); } }, q);
  view.replaceChildren(h("div", { class: "fade" },
    h("h1", {}, "What do you need to fill?"),
    h("p", { class: "muted", style: "margin:6px 0 18px" }, "Status, shortages, recalls and Ontario and BC coverage in one search."),

  if (hash.startsWith("/changes")) return pageChanges();
  if (hash.startsWith("/data")) return pageData();
  return pageSearch();
}
